<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="ARPENT — écran de démonstration : fiche de lot d'un immeuble, courtage immobilier. Entreprise fictive.">

<!-- ============================================================
     ARPENT · IMMOBILIER — UN SEUL ÉCRAN, 1440 × 900, ARRÊTÉ
     Plan : demos-secteurs/plans/immobilier.md — il fait autorité.
     Site de démonstration. Entreprise fictive, lot inventé,
     coordonnées neutres. Aucun montant, nulle part.

     LA CELLULE, ET ELLE EST EXCLUSIVE
     ------------------------------------------------------------
     · palette  TERRE CUITE / SABLE SATURÉ + BRUN PROFOND — le seul
                écran chaud-saturé des douze ;
     · type     GROTESQUE ÉTENDUE EN CAPITALES (`archivo-exp`,
                axe `wdth` 125) — l'inverse exact de l'ultra-
                condensée du gym, et personne d'autre n'a d'extended ;
     · compo    QUATRE BANDES HORIZONTALES PLEINE LARGEUR — aucune
                colonne, aucun split vertical ;
     · photo    BOÎTE AUX LETTRES 1440 × 340 — le seul letterbox.

     LE MOMENT FORT, EN UNE PHRASE
     ------------------------------------------------------------
     La terre cuite de la bande de titre et l'ocre de l'enduit
     photographié sont LA MÊME MATIÈRE : la page et l'immeuble sont
     faits de la même couleur, et la bande de photographie continue
     la bande peinte au lieu de s'y opposer. C'est ce qui a décidé de
     la photographie, et aucune autre des dix-sept ne le fait.

     CE QUI A CHANGÉ DEPUIS LA PASSE PRÉCÉDENTE, ET POURQUOI
     ------------------------------------------------------------
     A · LA PHOTOGRAPHIE. `immobilier-16` était un pavillon de
         banlieue à revêtement de vinyle photographié de trois quarts
         depuis le trottoir : une vue MLS, pas une image
         d'architecture. Les seize sources ont été rejugées SUR LA
         TRANCHE de 4,235 : 1 qu'elles rendraient — aucune ne tient
         cette proportion, le défaut est géométrique. `immobilier-17`
         est un recadrage VRAI (fichier 2400 × 567, pas un
         `object-position` — piège 60) d'une façade frontale à trois
         fenêtres cintrées sous un enduit ocre saturé.
     B · LE SERIF SUR CRÈME EST PARTI. `dm-serif` sur `#f2efe9`
         mettait cet écran en quatrième position derrière boutique,
         coiffure et juridique. Il n'y a plus une seule serif ici, ni
         un seul crème : une famille, étendue, et un champ de sable
         saturé à 60 % de saturation.
     C · LE SPLIT VERTICAL EST PARTI. La composition était deux
         colonnes séparées par un filet à x = 720. Elle est
         maintenant quatre bandes empilées : 64 / 340 / 340 / 156.
     D · LE TITRE PASSE DE 80 À 138 px ET DOMINE SEUL. L'ancien écran
         opposait un titre de 80 px à un chiffre de 84 px : deux
         masses de même poids qui s'annulaient. Le titre gagne ; les
         chiffres deviennent de la TEXTURE — quatre cellules
         régulières, libellés à 10 px, valeurs à 34 px, exactement le
         seuil de lisibilité à 0,29.
     ============================================================ -->

<!-- L'instant du geste, en millisecondes. Le volet parcourt 900 ms en
     `cubic-bezier(.16, 1, .3, 1)` ; sa sortie vaut 3u − 3u² + u³, donc
     la course 0,8125 est atteinte à u = 0,4276, soit x(u) = 0,2396 du
     temps, soit 216 ms. La lisière tombe alors à x = 1170.

     POURQUOI 1 170 ET PAS 893. À 62 % de course la lisière tombait
     dans le TRUMEAU entre le deuxième et le troisième arc : une
     coupure propre, qui se lit comme une fin de bande et pas comme un
     bord en mouvement. À 1 170 elle coupe le troisième arc EN PLEINE
     OUVERTURE — un arc à moitié découvert ne peut se lire que comme
     un mouvement en cours. Le pan de terre cuite garde 270 px de
     large sur 340 de haut : à 0,29 il pèse encore 78 × 99 px, très
     au-dessus des 12 px du piège 71. Relevé par sonde, pas estimé. -->
<meta name="aped-instant" content="216">

<title>ARPENT — courtage immobilier · site de démonstration</title>

<style>
/* ── UNE SEULE FAMILLE, DEUX GRAISSES ─────────────────────────────
   `archivo-exp` est Archivo demandée sur son axe de chasse `wdth` à
   125 — la seule ÉTENDUE du dépôt, téléchargée le 2026-08-01 par
   `node tools/polices-demos.mjs archivo-exp`, licence SIL OFL 1.1
   relevée dans `fonts/demos/_licences.json`. Zéro requête tierce.
   Un seul sous-ensemble : tout le texte de cet écran tient dans le
   latin de base plus le tiret cadratin, le point médian, l'espace
   fine insécable, l'exposant deux et l'apostrophe courbe. Le
   sous-ensemble « latin étendu » n'est pas déclaré : il ne serait
   jamais demandé. */
@font-face{
  font-family:"archivo-exp";
  src:url("../../fonts/demos/archivo-exp-1.woff2") format("woff2");
  font-style:normal; font-weight:500; font-display:swap;
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face{
  font-family:"archivo-exp";
  src:url("../../fonts/demos/archivo-exp-3.woff2") format("woff2");
  font-style:normal; font-weight:700; font-display:swap;
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ── CINQ VALEURS, TOUTES CHAUDES ─────────────────────────────────
   Il n'y a ni gris, ni blanc, ni noir sur cet écran : la valeur la
   plus claire est un sable à 60 % de saturation, la plus sombre un
   brun de terre d'ombre. Contrastes calculés, pas espérés :
     sable    sur brun       10,49 : 1
     sable+   sur terre cuite 4,75 : 1   (seuil AA de 4,5 tenu même
                                          pour les libellés de 10 px)
     brun     sur sable      10,49 : 1
     brun moy sur sable       5,29 : 1
   La terre cuite est `#a9431a` et pas `#c0521f` : le second rendait
   2,96 : 1 sous le titre en sable, donc en dessous du seuil des
   grands corps. On assombrit le FOND, jamais on n'éclaircit un texte
   déjà presque blanc — la masse doit rester une masse. */
:root{
  --brun:#2e1a10;        /* la bande de tête, l'encre du registre */
  --brun-moy:#6b452e;    /* les libellés du registre, et rien d'autre */
  --cuite:#a9431a;       /* la masse de titre, et le seul pavé d'action */
  --sable:#e9c9a8;       /* le champ du registre */
  --sable-clair:#f6e4ce; /* tout texte posé sur un fond sombre */

  /* L'UNITÉ DE LA COMPOSITION. Vaut exactement 1 px à 1440 × 900 :
     toutes les cotes sont alors au pixel. En dessous, rien ne se
     déforme — la composition de 1440 ne s'applique qu'au-delà de
     1200 px, et sous ce seuil c'est l'empilement fluide qui sert. */
  --s:1px;
  --s:min(1px, 100vw / 1440, 100vh / 900);
}

*{ box-sizing:border-box }
html,body,figure,dl,dd,h1,p{ margin:0; padding:0 }
body{
  background:var(--sable);
  color:var(--brun);
  font-family:"archivo-exp", "Archivo", Arial, sans-serif;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
}
img{ display:block; max-width:100% }
a{ color:inherit; text-decoration:none }

/* ═════════════════════════════════════════════════════════════════
   1 · L'EMPILEMENT FLUIDE — la base, celle d'un moteur qui ne
   comprend rien de plus. Les quatre bandes y sont déjà, elles ne
   sont simplement pas cotées au pixel.
   ═════════════════════════════════════════════════════════════════ */

.ecran{ display:flex; flex-direction:column }

/* ── BANDE 1 · LE BANDEAU ─────────────────────────────────────── */
.bandeau{
  display:flex; flex-wrap:wrap; align-items:baseline;
  column-gap:clamp(14px, 3vw, 26px); row-gap:6px;
  background:var(--brun); color:var(--sable-clair);
  padding:16px clamp(18px, 4vw, 56px);
}
.marque{
  font-weight:700; font-size:20px; line-height:1;
  letter-spacing:.22em; text-transform:uppercase;
}
.descripteur{
  font-size:10px; line-height:1; letter-spacing:.26em;
  text-transform:uppercase;
}
.liens{
  display:flex; flex-wrap:wrap; gap:clamp(14px, 2vw, 26px);
  margin-left:auto;
  font-size:11px; line-height:1; letter-spacing:.22em;
  text-transform:uppercase;
}
.liens a{ transition:opacity 160ms linear }
.liens a:hover{ opacity:.62 }

/* ── BANDE 2 · LA MASSE DE TITRE ──────────────────────────────── */
.masse{
  background:var(--cuite); color:var(--sable-clair);
  padding:20px clamp(18px, 4vw, 56px) 30px;
}
.repere{
  display:flex; flex-wrap:wrap; align-items:baseline;
  justify-content:space-between; gap:6px 20px;
  font-size:11px; line-height:1.6; letter-spacing:.26em;
  text-transform:uppercase;
}
/* Deux lignes, calées à DEUX BORDS DIFFÉRENTS — la leçon d'O'Higgins.
   La coupe est manuelle : une adresse ne se laisse pas couper par le
   navigateur. */
.adresse{
  margin-top:14px;
  font-weight:700; text-transform:uppercase;
  font-size:clamp(30px, 8.6vw, 92px); line-height:.86;
  letter-spacing:.004em;
}
.adresse .l2{ display:block; text-align:right }

/* ── BANDE 3 · LA BOÎTE AUX LETTRES ───────────────────────────────
   Le fichier est DÉJÀ en 4,235 : 1 — c'est un vrai recadrage, pas un
   `object-position` sur un 16/9. Le geste vit à l'intérieur. */
/* Le fond de la boîte est la TERRE CUITE et pas le brun : tant que la
   photographie n'est pas peinte, la bande est la masse de titre qui
   continue — jamais un rectangle sombre qui se lit comme une image
   manquante. Vu sur une capture prise à 300 ms. */
.boite{ position:relative; overflow:hidden; background:var(--cuite) }
/* Au repli, la hauteur est plafonnée par le bas : à 390 px de large,
   un 4,235 : 1 laissé libre ne fait plus que 92 px de haut et la
   boîte aux lettres devient une plinthe. 120 px au minimum — les arcs
   restent des arcs. */
.boite img{
  width:100%; height:clamp(120px, 23.6vw, 340px); object-fit:cover;
  /* La photographie n'est pas virée : sa couleur EST la palette. Le
     seul réglage relève le noir des embrasures d'un cheveu pour que
     les trois arcs se détachent du champ à 0,29. */
  filter:saturate(1.06) contrast(1.04);
}

/* LE VOLET — le seul geste de l'écran, ET IL EST EN TERRE CUITE.
   Un pan de la MÊME terre cuite que la bande de titre couvre la boîte
   aux lettres, puis se retire VERS LA DROITE, arête franche, en
   900 ms. Direction justifiée : une bande se lit de gauche à droite,
   et la lisière découvre les arcs dans l'ordre où l'œil les prend.

   POURQUOI TERRE CUITE ET PLUS BRUN. La première passe le peignait en
   brun : sur l'image arrêtée, le rectangle sombre se lisait comme une
   image qui n'a pas chargé, pas comme un mouvement. En terre cuite il
   est la MASSE DE TITRE QUI DESCEND — la couleur peinte se retire et
   découvre exactement la même couleur, en pierre. C'est le sujet de
   l'écran, rendu littéral par son unique geste.

   Il ne recouvre AUCUN texte à aucun instant — il n'y a pas un
   caractère sur la photographie — donc rien ne peut se figer à mi-mot
   (piège 70). ÉTAT DE REPOS = ÉTAT FINAL : une page dont l'animation
   ne joue pas montre la bande entière. */
.volet{
  position:absolute; inset:0;
  background:var(--cuite);
  /* 10 px et pas 1 : réduit à 0,29 dans le panneau, un filet de 1 px
     pèse 0,29 px et disparaît. À 10 px il reste 2,9 px de lumière sur
     la lisière, et l'arête se lit encore comme une arête — c'est elle
     qui dit que ce bord est en train de bouger. Piège 71. */
  border-left:10px solid var(--sable-clair);
  transform:translateX(100%);
  display:none;
}
@keyframes volet{
  from{ transform:translateX(0) }
  to  { transform:translateX(100%) }
}
@supports (animation-name:none){
  .volet{ display:block; animation:volet 900ms cubic-bezier(.16, 1, .3, 1) }
}

/* ── BANDE 4 · LE REGISTRE ────────────────────────────────────────
   Quatre cellules et un pavé d'action, en RANG. Les chiffres sont de
   la texture : à 0,29 un libellé de 10 px pèse 2,9 px et une valeur
   de 34 px pèse 9,9 px. Le libellé n'est donc PAS de l'information
   qu'on croit lire — c'est un gris régulier sous une rangée de
   valeurs. Composé comme tel : même hauteur, même retrait, même
   ligne de base, d'une cellule à l'autre. */
.registre{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  background:var(--brun);
  gap:1px;
}
/* La `<dl>` reste dans le document — un registre de chiffres EST une
   liste de définitions — mais elle disparaît de la mise en page pour
   que ses cellules soient les enfants directs de la grille. Le pavé
   d'action, lui, n'est pas une définition : il vit hors de la liste,
   et c'est pour ça que la grille est un `<div>` et pas la `<dl>`. */
.fiche{ display:contents }
.cellule{
  background:var(--sable);
  padding:16px clamp(14px, 1.7vw, 24px) 20px;
}
.cellule dt{
  font-size:10px; line-height:1.4; letter-spacing:.24em;
  text-transform:uppercase; color:var(--brun-moy);
}
.cellule dd{
  margin:10px 0 0;
  font-weight:700; font-size:clamp(24px, 3.2vw, 34px); line-height:1;
  letter-spacing:.01em;
}
/* L'espace fine insécable avance de 0,05 em dans Archivo : à 34 px
   elle ne fait que 1,7 px contre une chasse de chiffre de 22,4 px, et
   « 4 782 106 » se lit « 4782106 ». Les 0,10 em ajoutés la portent à
   5,1 px — un cinquième de cadratin, la valeur d'une vraie espace
   fine. Le caractère reste celui de la convention québécoise. */
.f{ letter-spacing:.10em }

/* Au repli, le pavé prend TOUTE la rangée : avec quatre cellules et
   lui, une grille en `auto-fit` le laisse seul sur sa ligne et
   découvre le fond brun de la grille à côté — un rectangle sombre
   vide, qui se lit comme un défaut. */
.action{
  grid-column:1 / -1;
  display:flex; flex-direction:column; justify-content:center;
  gap:8px;
  background:var(--cuite); color:var(--sable-clair);
  padding:16px clamp(14px, 1.7vw, 24px);
  transition:background-color 180ms linear;
}
.action:hover{ background:var(--brun) }
.action b{
  font-weight:700; font-size:15px; line-height:1.2; letter-spacing:.14em;
  text-transform:uppercase;
}
.action span{ font-size:11px; line-height:1; letter-spacing:.2em }

/* L'anneau se pose DEHORS sur les liens de nav et DEDANS sur le pavé.
   Mesuré en tabulant, pas déduit (piège 51) : un lien de nav fait
   11 px de haut, et un `outline-offset` de −6 px y dessinait un
   rectangle de hauteur NÉGATIVE — l'anneau existait dans la feuille
   et pas à l'écran. Sur le pavé de 360 × 156, l'anneau intérieur est
   le bon : posé dehors, il déborderait du bord droit de la fenêtre. */
a:focus-visible{ outline:3px solid var(--brun); outline-offset:4px }
.bandeau a:focus-visible{ outline-color:var(--sable-clair) }
.action:focus-visible{ outline-color:var(--sable-clair); outline-offset:-8px }

/* ═════════════════════════════════════════════════════════════════
   2 · LA COMPOSITION DE 1440 × 900
   Quatre bandes, cotées au pixel :
       y   0 →  64   bandeau        brun          64 px
       y  64 → 404   masse de titre terre cuite  340 px
       y 404 → 744   boîte aux lettres           340 px
       y 744 → 900   registre       sable        156 px
   Somme exacte : 900. Gouttières latérales 56 px, x 56 → 1384.
   ═════════════════════════════════════════════════════════════════ */
@media (min-width:1200px){

  html,body{ height:100% }
  .ecran{ height:100%; display:block }

  /* BANDE 1 — le mot-symbole à gauche, la navigation à droite, une
     seule ligne de base à y = 40. */
  .bandeau{
    position:relative; height:calc(64 * var(--s));
    display:block; padding:0;
  }
  .marque{
    position:absolute; left:calc(56 * var(--s)); top:calc(20 * var(--s));
    font-size:calc(20 * var(--s)); line-height:calc(20 * var(--s));
  }
  .descripteur{
    position:absolute; left:calc(232 * var(--s)); top:calc(30 * var(--s));
    font-size:calc(10 * var(--s)); line-height:calc(10 * var(--s));
    white-space:nowrap;
  }
  .liens{
    position:absolute; right:calc(56 * var(--s)); top:calc(29 * var(--s));
    margin:0; gap:calc(26 * var(--s)); flex-wrap:nowrap; white-space:nowrap;
    font-size:calc(11 * var(--s)); line-height:calc(11 * var(--s));
  }

  /* BANDE 2 — la masse. Le titre est le plus gros objet de l'écran
     et il n'y a rien pour lui disputer la place : deux lignes de
     138 px, la première calée sur x = 56, la seconde sur x = 1384.
     Interlignage 118 px, soit 0,855 — les lignes s'emboîtent. */
  .masse{
    position:relative; height:calc(340 * var(--s)); padding:0;
  }
  .repere{
    position:absolute; top:calc(22 * var(--s));      /* base y = 95 */
    left:calc(56 * var(--s)); right:calc(56 * var(--s));
    flex-wrap:nowrap; white-space:nowrap; gap:0;
    font-size:calc(11 * var(--s)); line-height:calc(11 * var(--s));
  }
  /* 150 px, interlignage 144, soit 0,96 — et les deux chiffres sont
     RELEVÉS, pas choisis.
     · 150 parce que « L’ARDOISIÈRE » avance de 8,787 em approche
       comprise : à 150 px la ligne mesure 1 318 px pour une colonne
       de 1 328. Elle remplit l'écran d'un bord à l'autre à 10 px près,
       et c'est la raison du corps.
     · 144 parce que le È monte à 0,88 em quand la capitale s'arrête à
       0,69 : à 132 px d'interlignage l'accent du È de la seconde ligne
       ENTRAIT DANS le D de la première — vu sur la capture de la
       première passe, pas déduit. Il faut 132 px pour dégager
       l'accent ; 144 laisse 12 px d'air. En dessous, ce n'est plus un
       interlignage serré, c'est une collision. */
  .adresse{
    position:absolute; top:calc(39 * var(--s));
    left:calc(56 * var(--s)); right:calc(56 * var(--s));
    margin:0; white-space:nowrap;
    font-size:calc(150 * var(--s)); line-height:calc(144 * var(--s));
  }

  /* BANDE 3 — 1440 × 340, bord à bord, aucune marge. */
  .boite{ height:calc(340 * var(--s)) }
  .boite img{ width:100%; height:100%; object-fit:cover }

  /* BANDE 4 — quatre cellules de 270 px et un pavé de 360 px, séparés
     par des filets de 1 px de brun. 4 × 270 + 360 = 1440.
     Une seule ligne de base pour les quatre libellés (y = 780) et une
     seule pour les quatre valeurs (y = 855) : c'est ce partage qui en
     fait un RANG et non quatre compositions.
     360 et pas 320 : le pavé d'action est en terre cuite, la lisière
     du volet est arrêtée à x = 1 170, et la bande de titre est en
     terre cuite elle aussi. À 320 le pavé commençait à 1 120, donc
     50 px à gauche de la lisière — un décalage assez petit pour se
     lire comme un défaut d'alignement. À 360 il commence à 1 080 et
     l'écart passe à 90 px : on voit que ce sont DEUX objets, et que
     celui du haut est en train de bouger. */
  .registre{
    height:calc(156 * var(--s));
    grid-template-columns:repeat(4, calc(270 * var(--s))) 1fr;
    gap:0;
  }
  .cellule{
    position:relative; padding:0;
    border-left:1px solid var(--brun);
  }
  .cellule:first-child{ border-left:0 }
  .cellule dt{
    position:absolute; left:calc(24 * var(--s)); top:calc(26 * var(--s));
    font-size:calc(10 * var(--s)); line-height:calc(10 * var(--s));
    white-space:nowrap;
  }
  .cellule dd{
    position:absolute; left:calc(24 * var(--s)); top:calc(87 * var(--s));
    margin:0;
    font-size:calc(34 * var(--s)); line-height:calc(34 * var(--s));
    white-space:nowrap;
  }
  .action{
    grid-column:auto;
    padding:0; gap:0; position:relative;
    border-left:1px solid var(--brun);
  }
  .action b{
    position:absolute; left:calc(28 * var(--s)); top:calc(52 * var(--s));
    font-size:calc(15 * var(--s)); line-height:calc(15 * var(--s));
    white-space:nowrap;
  }
  .action span{
    position:absolute; left:calc(28 * var(--s)); top:calc(88 * var(--s));
    font-size:calc(11 * var(--s)); line-height:calc(11 * var(--s));
    white-space:nowrap;
  }
}

/* ── MOUVEMENT RÉDUIT ─────────────────────────────────────────────
   Pas de volet du tout : la boîte aux lettres est entière dès le
   premier rendu. Aucune information n'est portée par le geste, donc
   rien ne se perd. Ce bloc est le DERNIER : il doit l'emporter sur la
   règle d'affichage du volet. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important }
  .volet{ display:none }
}
</style>
</head>

<body>
<main class="ecran">

  <!-- BANDE 1 -->
  <header class="bandeau">
    <span class="marque">Arpent</span>
    <span class="descripteur">Courtage immobilier</span>
    <nav class="liens" aria-label="Principale">
      <a href="#">Propriétés</a>
      <a href="#">Évaluation</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- BANDE 2 -->
  <section class="masse">
    <p class="repere">
      <span>Fiche de lot — inscription 2026</span>
