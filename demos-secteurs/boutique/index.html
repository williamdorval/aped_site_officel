<title>Grès Saulnier — céramique utilitaire de grès · site de démonstration</title>

<!-- ============================================================
     GRÈS SAULNIER — UN SEUL ÉCRAN, 1440 × 900, ARRÊTÉ
     Plan : demos-secteurs/plans/boutique.md — il fait autorité.

     LE MOMENT FORT, ET ON PEUT LE NOMMER EN UNE LIGNE :
     « le mot “cuit.” est posé sur le grès. »
     Le titre commence sur le papier, à x 64, et sa seconde ligne
     TRAVERSE la couture de la photographie à x 596 : les 254
     derniers pixels de la ligne — le mot « cuit. » entier, jamais
     une lettre coupée (piège 70) — reposent sur l'émail de la
     pièce. La photographie cesse d'être un carré posé à droite :
     elle est le support d'un mot.

     LA COMPOSITION EST ASYMÉTRIQUE, ET ÇA SE MESURE :
     le titre occupe x 64 → 850 (54,6 % de la largeur), la
     photographie x 596 → 1440 (58,6 %). 54,6 + 58,6 = 113,2 : les
     deux majorités SE CHEVAUCHENT sur 254 px. Un split 50/50 fait
     100,0 et ne chevauche rien.

     LA PHOTOGRAPHIE OCCUPE 844 × 900 = 58,6 % DE L'ÉCRAN.
     Elle déborde par la droite, par le haut et par le bas ; son
     seul bord intérieur est la couture de gauche, et c'est
     exactement celle que le titre franchit.

     LE GESTE, ET IL N'Y EN A QU'UN — « L'ÉTABLI AVANCE ».
     La réglette d'olive part du bord gauche et pousse vers la
     couture de la photographie : scaleX(0) → scaleX(1) sur
     1 000 ms, départ à +200 ms. Elle N'EST PAS ARRIVÉE sur
     l'image : son point d'arrivée — l'arête verticale de la
     photographie — est VISIBLE dans le cadre, donc « à mi-course »
     se lit sans rien avoir à comparer. 128 px de haut, 227 px de
     vide devant elle : à 0,29 ça pèse encore 37 × 107 px.

     L'INSTANT DE CAPTURE, 603 ms — ce n'est pas un chronomètre.
     cubic-bezier(.4,0,.2,1) atteint y = 0,62 en u = 0,581, dont
     l'abscisse vaut 0,403. 200 ms de retard + 0,403 × 1 000 ms =
     603 ms de temps local. L'outil met l'animation en PAUSE et pose
     son currentTime à cette valeur : deux passes rendent la même
     image. La vérification se fait sur la GÉOMÉTRIE, jamais sur
     l'image (piège 1) :
     document.querySelector('.etabli').getBoundingClientRect().width
     doit valoir 369 ± 4 px pour une réglette au repos de 596.
     Relevé : 369,3 px. Photo occupée : 58,6 % (sonde, pas déduit).
     ============================================================ -->
<meta name="aped-instant" content="603">

@font-face{font-family:"fraunces";src:url("../../fonts/demos/fraunces-3.woff2") format("woff2");font-style:normal;font-weight:900;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}

@font-face{font-family:"karla";src:url("../../fonts/demos/karla-2.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap;unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;}

/* ── LA MATIÈRE — cinq valeurs, pas six ─────────────────────────
   argile : le papier, plein cadre, un seul ton, zéro texture.
   olive  : la seule masse d'appui, la réglette qui avance.
   aubergine / prune : la même famille, deux densités d'encre.
   pale   : la mention de démonstration, et rien d'autre.
   Le grès #AFA699 n'est pas déclaré : c'est le fond propre de la
   photographie, la page ne le pose jamais.
   Contrastes (WCAG 2.1, sRGB linéarisé, pas color-mix — piège 6) :
   aubergine/argile 10,7:1 · prune/argile 8,3:1 · argile/aubergine
   10,7:1 · pale/argile 7,0:1 · aubergine/émail (le titre sur la
   photographie) 7,13:1 au pire pixel, 10,48:1 en moyenne — mesuré à
   l'encre peinte par tools/pire-pixel.mjs, pas déduit.
   `--pale` était #6B5661, arithmétiquement à 5,1:1. Sur du mono de
   10 px, la mesure à l'encre peinte rendait 3,79 au pire pixel :
   des fûts d'un pixel ne couvrent pas leur pixel. On a donc foncé
   la valeur plutôt que discuter l'instrument.
   L'OLIVE NE PORTE AUCUN TEXTE, et c'est délibéré : argile sur
   olive tombe à 2,6:1 et aubergine sur olive à 4,1:1. Deux échecs.
   La réglette est une masse, pas un support. */
:root{
  --argile:#E7DFD2;
  --olive:#7E8F6E;
  --aubergine:#3B2431;
  --prune:#4A3742;
  --pale:#54424C;

  --marge:64px;    /* le fer à gauche de toute la colonne de papier */
  --couture:596px; /* l'arête gauche de la photographie */
  --h1:156px;
  --regle:128px;   /* hauteur de la réglette d'olive */
}

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--argile)}
body{
  min-height:100%;
  background:var(--argile);
  color:var(--prune);
  font-family:"karla",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
li{list-style:none}
a:focus-visible{outline:2px solid var(--aubergine);outline-offset:3px}

/* ── LE CANEVAS ─────────────────────────────────────────────────
   900 px exactement : à 1440 × 900 le document tient dans la
   fenêtre, rien en dessous, aucune barre de défilement. */
.ecran{position:relative;width:100%;height:900px;overflow:hidden}

/* ── ① LE CARTOUCHE — en haut à GAUCHE, groupé ──────────────────
   Pas de bandeau, pas de filet, pas de nav au fer à droite : c'est
   le trio qui fait « gabarit de boutique ». Le nom et les quatre
   liens forment UN bloc calé sur la même marge que le titre, et le
   reste de la ligne haute est du vide. */
.nom{
  position:absolute;left:var(--marge);top:26px;z-index:3;
  font-family:"fraunces",Georgia,serif;font-weight:900;
  font-size:20px;line-height:26px;letter-spacing:-.005em;
  color:var(--aubergine);
}
.nav{position:absolute;left:var(--marge);top:64px;z-index:3}
.nav ul{display:flex;gap:24px}
.nav a{
  position:relative;display:block;
  font-weight:700;font-size:11px;line-height:14px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--aubergine);
}
.nav li:last-child a{margin-right:-.16em}
/* MICRO-INTERACTION — un filet de 1 px qui SE TRACE de gauche à
   droite : la direction suit le sens de lecture. */
.nav a::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;
  background:var(--aubergine);
  transform:scaleX(0);transform-origin:left center;
  transition:transform 160ms cubic-bezier(.4,0,.2,1);
}
.nav a:hover::after,.nav a:focus-visible::after{transform:scaleX(1)}

/* ── ② LA PHOTOGRAPHIE — 844 × 900, 58,6 % de l'écran ───────────
   Elle déborde à droite, en haut et en bas. Son unique bord
   intérieur est la couture de gauche, x = 596, et c'est celle que
   le titre traverse. Source 960 × 720, boîte 844 × 900 : le
   facteur de recouvrement vaut 1,25 — 675 px de source pour 844 px
   rendus, donc un CADRAGE SERRÉ (70 % de la largeur du fichier) au
   prix d'un agrandissement de 1,25. La source est NETTE de bord à
   bord : boutique-11 a été écartée ici pour sa faible profondeur de
   champ, qu'un agrandissement de 1,25 rendait floue à 844 px.
   Attributs width/height aux dimensions RÉELLES du fichier (CLS 0),
   fetchpriority="high", aucun lazy : c'est le LCP. */
.piece{position:static}
.plaque{
  position:absolute;z-index:1;top:0;bottom:0;right:0;left:var(--couture);
}
/* L'ÉTALONNAGE — et il n'est pas décoratif. Le fichier est éclairé
   au jour, donc son blanc est FROID ; l'argile de la page est un
   beige chaud. Côte à côte, la photographie tirait au gris et la
   moitié droite de l'écran se lisait délavée. On la ramène dans la
   famille du papier : sepia pour virer le blanc vers le chaud,
   saturate pour lui rendre la couleur que le sepia a mangée,
   contrast pour que l'arête de l'assiette existe. Trois valeurs,
   relevées en regardant : sepia(.16) fondait la couture au point
   qu'on ne voyait plus qu'il y avait une photographie ; .10 laisse
   l'arête de l'assiette exister. */
.plaque img{
  width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  filter:sepia(.10) saturate(1.20) contrast(1.10);
}

/* ── ③ LE TITRE — deux lignes, 156 px, bas de casse ─────────────
   Il PASSE PAR-DESSUS la photographie (z-index 3 contre 1). Jamais
   l'inverse : une lettre occultée par un objet se lit comme un mot
   tronqué (piège 70). Ici c'est l'encre qui est au-dessus, et le
   mot « cuit. » est entier.
   Interlignage 0,86 — à cette échelle on serre ; Ōmbia mesure 0,95
   à 90 px, on descend parce qu'on monte. */
.titre{
  position:absolute;left:var(--marge);top:232px;z-index:3;
  font-family:"fraunces",Georgia,serif;font-weight:900;
  font-size:var(--h1);line-height:.86;letter-spacing:-.03em;
  color:var(--aubergine);
}

/* ── ④ LA COLONNE DE PAPIER — sous le titre, au fer à gauche ────
   Le paragraphe est DESCENDU : à 0,29 il pèse 4 px, c'est de la
   texture, pas de l'information. Il est donc composé comme de la
   texture — trois lignes régulières dans 344 px — et posé sous le
   titre, jamais à côté de lui. */
.soustitre{
  position:absolute;left:var(--marge);top:556px;width:344px;z-index:3;
  font-weight:400;font-size:15px;line-height:26px;color:var(--prune);
}
.bouton{
  position:absolute;left:var(--marge);top:672px;z-index:3;
  display:flex;align-items:center;justify-content:center;
  width:232px;height:56px;
  background:var(--aubergine);border:1px solid var(--aubergine);
  color:var(--argile);
  font-weight:700;font-size:12px;line-height:1;letter-spacing:.16em;
  text-transform:uppercase;
  transition:background-color 140ms cubic-bezier(.4,0,.2,1),
             color 140ms cubic-bezier(.4,0,.2,1);
}
.bouton span{margin-right:-.16em}
/* MICRO-INTERACTION — l'inversion. Elle garde 10,7 : 1 ; passer le
   fond en olive tomberait à 2,6 : 1, donc c'est interdit. */
.bouton:hover,.bouton:focus-visible{background:var(--argile);color:var(--aubergine)}

/* La mention obligatoire tient l'autre bout de la ligne de tête :
   le nom au fer à gauche sur x 64, elle au fer à droite sur x 532,
   c'est-à-dire 64 px avant la couture. Elle remplit le seul bandeau
   large de la page et laisse le coin bas-gauche entier à la
   réglette.
   ELLE A D'ABORD ÉTÉ POSÉE AU PIED DE LA PHOTOGRAPHIE, et c'était
   faux : « ENTREPRISE FICTIVE » tombait sur le pied d'argile crue
   de la tasse, un tan moucheté. La capture l'a montré tout de
   suite — la couleur déclarée du fond ne dit rien de ce qui est
   réellement peint sous un mot (piège 45). */
.mention{
  position:absolute;left:var(--marge);top:31px;z-index:3;
  width:calc(var(--couture) - var(--marge) - 64px);text-align:right;
  font-family:"jetbrains-mono",ui-monospace,monospace;font-weight:500;
  font-size:10px;line-height:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--pale);white-space:nowrap;
}

/* ── ⑤ LA LÉGENDE DE SPÉCIMEN — sur la photographie, au fer à droite
   C'est le dispositif de signature, pris à Ōmbia : `FIG. n` en
   monospace, une description technique, aucun adjectif. Elle est
   posée sur le mur clair du fond de la photographie : 6,81 : 1 au
   pire pixel, 9,29 : 1 en moyenne — vérifié à l'encre peinte par
   tools/pire-pixel.mjs, jamais déduit d'une couleur déclarée. */
.legende{
  position:absolute;right:var(--marge);top:112px;z-index:3;width:280px;
  font-family:"jetbrains-mono",ui-monospace,monospace;font-weight:500;
  font-size:11px;line-height:19px;letter-spacing:.12em;
  text-transform:uppercase;text-align:right;color:var(--aubergine);
}
.legende b{font-weight:500;display:block;margin-right:-.12em}
.legende::before{
  content:"";position:absolute;right:0;top:-16px;width:180px;height:1px;
  background:var(--aubergine);
}

/* ── ⑥ LA RÉGLETTE — LE GESTE, ET IL N'Y EN A QU'UN ─────────────
   Une masse d'olive de 596 × 128 collée au bord bas et au bord
   gauche, qui pousse vers la couture de la photographie. Elle est
   photographiée à 62 % : 369 px posés, 227 px de vide devant elle,
   et l'arête de la photographie — son point d'arrivée — est dans
   le cadre. C'est ce qui rend le « à mi-course » lisible sans
   seconde image.
   z-index 0 : elle passe SOUS la photographie, donc un dépassement
   d'un sous-pixel ne peut pas mordre sur l'image.
   `both` et non `forwards` : la règle du STANDARD vise les
   animations pilotées par le DÉFILEMENT sur une page longue, où
   `both` vide la moitié d'une capture pleine page. Ici la page fait
   900 px, l'animation est pilotée par le TEMPS, et `forwards`
   ferait sauter la réglette de 596 à 0 au bout des 200 ms de
   retard. */
.etabli{
  position:absolute;z-index:0;left:0;bottom:0;
  width:var(--couture);height:var(--regle);background:var(--olive);
  transform-origin:0 50%;
  animation:etabli 1000ms cubic-bezier(.4,0,.2,1) 200ms both;
  will-change:transform;
}
@keyframes etabli{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* Le filet qui dit où va la réglette. Statique, pleine longueur :
   sans lui, une masse arrêtée en l'air peut se lire comme un choix
   de composition plutôt que comme un mouvement. */
.rail{
  position:absolute;z-index:0;left:0;bottom:var(--regle);
  width:var(--couture);height:1px;background:var(--aubergine);
}

/* ── MOUVEMENT RÉDUIT — l'état de repos EST l'état final ────────
   `animation:none` rend la réglette à ses 560 px pleins. Aucune
   information ne se perd : elle ne porte ni texte, ni lien, ni
   donnée. Le titre, la photographie, la légende, le bouton et la
   nav sont lisibles et utilisables sans une seule image de
   l'animation. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ── 1280 → 1439 · 1024 → 1279 ──────────────────────────────────
   La composition de 1440 est celle qu'on photographie ; en dessous
   elle se resserre par paliers CHIFFRÉS plutôt que par un calc()
   fluide. Ce qui est tenu à chaque palier : le titre traverse
   TOUJOURS la couture, et la réglette s'arrête TOUJOURS dessus. */
@media (max-width:1439px) and (min-width:1280px){
  :root{--marge:52px;--couture:492px;--h1:134px;--regle:112px}
  /* La ligne de tête ne tient plus le nom ET la mention côte à
     côte : la colonne de papier a perdu 104 px. La mention passe
     donc sous la nav, au fer à gauche. Relevé, pas supposé — elle
     se superposait au nom, lisible sur la capture à 1280. */
  .mention{top:96px;width:auto;text-align:left}
  .titre{top:214px}
  .soustitre{top:508px;width:320px}
  .bouton{top:616px}
  .legende{top:100px}
}
@media (max-width:1279px) and (min-width:1024px){
  :root{--marge:40px;--couture:412px;--h1:108px;--regle:94px}
  .mention{top:96px;width:auto;text-align:left}
  .titre{top:186px}
  .soustitre{top:430px;width:296px}
  .bouton{top:530px}
  .legende{top:88px;width:230px}
  .legende::before{width:140px}
}

/* ── SOUS 1024 px — l'écran se remet sur un seul axe ────────────
   Les blocs s'empilent dans l'ordre de lecture. Le titre ne
   traverse plus rien : le chevauchement est une composition de
   bureau, et forcé sur 390 px il rendrait un mot illisible. La
   réglette reste, collée au bas du document, et garde son geste. */
@media (max-width:1023px){
  :root{--marge:24px;--regle:64px}
  .ecran{height:auto;min-height:100vh;overflow:visible;
         padding:26px var(--marge) calc(var(--regle) + 34px)}
  .nom,.nav,.titre,.soustitre,.bouton,.mention,.legende,.plaque{
    position:static;z-index:auto;
  }
  .nav{margin-top:10px}
  .nav ul{flex-wrap:wrap;gap:8px 20px}
  .titre{margin-top:34px;font-size:clamp(40px,11vw,86px);letter-spacing:-.025em}
  /* `display:block` n'est PAS décoratif : .plaque est un <span>, et
     un élément en ligne ignore `width` et `height`. */
  .plaque{display:block;margin:30px 0 0;width:100%;height:auto}
  .plaque img{width:100%;height:auto;aspect-ratio:4/3;object-position:50% 50%}
  .legende{width:auto;margin-top:16px;padding-top:14px;text-align:left;
           border-top:1px solid var(--aubergine)}
  .legende::before{display:none}
  .legende b{margin-right:0}
  .soustitre{width:auto;max-width:440px;margin-top:28px}
  .bouton{margin-top:26px}
  /* `width` et `text-align` sont REMIS : la mention porte à 1440 une
     largeur calculée sur la couture (596 − 64 − 64 = 468 px), et
     `--couture` n'existe plus ici. Laissée telle quelle, elle
     débordait de 142 px à 390 px de large — mesuré, pas supposé. */
  .mention{margin-top:26px;white-space:normal;width:auto;text-align:left}
  .etabli{width:min(62%,320px);height:var(--regle)}
  .rail{width:min(62%,320px)}
}
/* Un moteur qui ignore `aspect-ratio` rendrait la photographie dans
   une hauteur nulle : on lui donne une hauteur explicite. */
@supports not (aspect-ratio: 4 / 3){
  @media (max-width:1023px){
    .plaque img{height:calc((100vw - 48px) * 0.75)}
  }
}
</style>
</head>
