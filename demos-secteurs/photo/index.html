<!-- DEUX CORRECTIONS D'ÉCHELLE, AUCUNE DE REGISTRE.

     L'écran se regarde deux fois : en vraie taille dans la page, et
     réduit à 421 px de large dans un panneau, soit un facteur 0,29.
     Les deux défauts ci-dessous n'existaient QU'À LA SECONDE ÉCHELLE.

     1 · LE GESTE NE SURVIVAIT PAS AU PANNEAU — PIÈGE 57. Le filet
     d'un pixel du plan devient 0,29 px à 0,29 : le moteur l'étale en
     un gris que personne ne voit, et un écran dont le geste ne se
     voit pas est un écran fixe. La lisière du bain est donc une
     BANDE de 16 px de blanc cassé, large de 366 px (le tirage plus
     48 px de chaque côté), qui PRÉCÈDE l'arête au lieu de la
     souligner : elle reste entièrement sur le noir, contraste
     maximal, et le tirage se découvre dans son sillage. 366 × 16 px
     à 1440 → 106 × 4,6 px à 0,29 ; course 378 px → 110 px à 0,29.
     Le seuil est 12 px de plus petite dimension et 40 px de course.

     2 · LE HAUT SE LISAIT COMME UNE PAGE PAS CHARGÉE. Le tirage
     était posé à y 330–708 : lui et le bloc de titre tenaient tous
     les deux dans le tiers bas, et les 45 % du haut n'étaient tenus
     que par la ligne de tête, à 64 px du bord. Un vide n'est choisi
     que s'il est tendu entre deux choses éloignées. Le tirage monte
     donc de 111 px — y 219–597 — et traverse la ligne médiane : la
     tension se joue maintenant EN DIAGONALE, du tirage en haut à
     droite au titre en bas à gauche, et le vide passe SOUS le
     tirage, où il se lit comme sa marge et non comme un défaut.
     Rien n'est ajouté : le rapport de vide ne bouge pas.

     Le cartel suit le tirage. L'alignement caché qui traverse le
     vide n'est plus « cartel ligne 1 = sous-titre ligne 1 » (740)
     mais « cartel ligne 3 = titre ligne 1 » (661,4).

     L'INSTANT NE BOUGE PAS : 597 ms = 260 ms de retard + 337 ms de
     course ; avec cubic-bezier(.22,1,.36,1), 337/1400 = 24,08 % de
     temps rend 75,00 % de progression. La recette se mesure au
     pixel, jamais au chronomètre : l'arête du bain est à
     y = 313,5 ± 6, la bande juste au-dessus (297,5 → 313,5), les
     94 px hauts du tirage encore sous le noir. Le sujet — la dalle
     en porte-à-faux — reste coupé net : on comprend qu'il en reste.

     L'outil met toutes les animations en pause et pose leur temps
     local à cette valeur — jamais `animation-play-state` dans la
     page, `animation` est un raccourci qui remet `running`. -->

<style>
/* ═══════════════════════════════════════════════════════════════
   ATELIER LUMEN — un seul écran, 1440 × 900, arrêté.

   La thèse : le noir n'est pas un fond, c'est le mur ; la
   photographie est un tirage accroché dessus, et elle est en train
   de monter du bain quand on entre.

   CINQ FICHIERS DE POLICE, PAS UN DE PLUS. Trois familles :
   instrument-serif (romain + italique), inter (400 + 600),
   jetbrains-mono (500). Seuls les sous-ensembles latins sont
   déclarés — tous les signes de la page y sont, Œ · É · Ê · À · º
   et le cadratin compris.
   ═══════════════════════════════════════════════════════════════ */

@font-face{font-family:"instrument-serif";src:url("../../fonts/demos/instrument-serif-1.woff2") format("woff2");font-style:italic;font-weight:400;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:"instrument-serif";src:url("../../fonts/demos/instrument-serif-3.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:"inter";src:url("../../fonts/demos/inter-1.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:"inter";src:url("../../fonts/demos/inter-3.woff2") format("woff2");font-style:normal;font-weight:600;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:"jetbrains-mono";src:url("../../fonts/demos/jetbrains-mono-1.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}

/* ── TROIS VALEURS, ZÉRO ACCENT ─────────────────────────────────
   17,5 : 1 pour le blanc cassé, 6,1 : 1 pour le gris. Les deux
   passent AA en corps 10 px. Il n'y a pas de quatrième couleur, et
   c'est à ça qu'on reconnaît cet écran parmi les douze. */
:root{
  --noir:#000000;
  --blanc:#EDEAE4;
  --gris:#8A8A8A;
  --serif:"instrument-serif", Georgia, "Times New Roman", serif;
  --sans:"inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"jetbrains-mono", ui-monospace, "Courier New", monospace;
}

*{ box-sizing:border-box }
html{ background:var(--noir) }
body{
  margin:0;
  background:var(--noir);
  color:var(--gris);
  font-family:var(--sans);
  -webkit-text-size-adjust:100%;
}
figure{ margin:0 }
h1{ margin:0; font-weight:400 }
p{ margin:0 }
img{ max-width:100% }

/* Anneau de mise au point : un filet, jamais un rayon. */
a:focus-visible{ outline:1px solid var(--blanc); outline-offset:5px }

/* ═══ MISE EN PAGE DE BASE — TÉLÉPHONE ════════════════════════════
   Sous 1440 la composition se réorganise en colonne. Elle n'a pas à
   reproduire l'écran de bureau : elle a à rester lisible, à ne
   déborder nulle part, et à garder les trois mêmes valeurs. */
.scene{
  width:100%;
  min-height:100vh;
  padding:26px 22px 30px;
  display:flex;
  flex-direction:column;
  --course:302px;              /* hauteur du tirage : la course du bain */
}

.tete{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:10px 20px; margin-bottom:40px }
.marque{ font-family:var(--sans); font-weight:600; font-size:12px; line-height:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--blanc) }
.nav{ display:flex; gap:18px }
.lien{
  font-family:var(--sans); font-weight:400; font-size:12px; line-height:12px;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--gris); text-decoration:none;
  transition:color 180ms linear;
}
.lien.courant{ color:var(--blanc) }
.lien:hover, .lien:focus-visible{ color:var(--blanc) }

.dit{ display:block }
.titre{
  font-family:var(--serif); font-size:38px; line-height:40.3px;
  color:var(--blanc); margin-bottom:16px;
}
.t1, .t2{ display:block; white-space:nowrap }
.t2{ font-style:italic }               /* la seule autre voix de l'écran */
.soustitre{
  max-width:306px;
  font-family:var(--sans); font-weight:400; font-size:13px; line-height:19.5px;
  color:var(--gris);
  margin-bottom:30px;
}

.bouton{
  position:relative; display:inline-block;
  font-family:var(--sans); font-weight:400; font-size:12px; line-height:12px;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--gris); text-decoration:none;
  transition:color 180ms linear;
}
.bouton:hover, .bouton:focus-visible{ color:var(--blanc) }
/* Le filet du libellé : exactement sa largeur. `right` retranche
   l'interlettrage que le dernier caractère traîne derrière lui
   (0,1 em × 12 px = 1,2 px), sinon le trait dépasse le mot. */
.bouton::after{
  content:""; position:absolute; left:0; right:1.2px;
  top:20px; height:1px; background:var(--blanc);   /* 9,99 px sous le haut de boîte + 10 */
}

.tirage{ position:relative; margin:30px 0 0 }
.epreuve{
  display:block; width:216px; height:302px;
  clip-path:inset(0 0 0 0);        /* état de REPOS = état FINAL */
}
/* LA LISIÈRE DU BAIN — une BANDE, pas un filet. Piège 57 : à 0,29 un
   trait d'un pixel n'existe plus. 16 px de haut, et son BAS porte
   l'arête : elle reste tout entière sur le noir, le tirage se
   découvre derrière elle. */
.lisiere{
  position:absolute; left:-16px; top:-16px;
  width:248px; height:16px;
  background:var(--blanc);
  opacity:0;                        /* repos : la lisière n'existe plus */
}
.cartel{ display:block; margin-top:16px }
.c1, .c2, .c3{
  display:block;
  font-family:var(--mono); font-weight:500; font-size:10px; line-height:16px;
  letter-spacing:.08em; text-transform:uppercase;
}
.c1{ color:var(--blanc) }
.c2, .c3{ color:var(--gris) }

.pied{ margin-top:auto; padding-top:40px }
.coord, .mention{
  font-family:var(--mono); font-weight:500; font-size:10px; line-height:16px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--gris);
}

/* ═══ LE GESTE : LE BAIN ══════════════════════════════════════════
   Un seul mouvement sur tout l'écran. Le tirage monte hors du noir,
   du bas vers le haut — le sens dans lequel on relève une épreuve du
   révélateur. Une BANDE de 16 px, large du tirage plus 48 px de
   chaque côté, précède l'arête et s'éteint sur les 8 derniers pour
   cent de la course visuelle (soit 40,48 % du temps avec cette
   courbe). Seize pixels et non un, parce qu'un pixel ne survit pas à
   la réduction de 0,29 du panneau — piège 57.
   Aucune bibliothèque : trois @keyframes, rien d'autre. */
@keyframes bain{
  from{ clip-path:inset(100% 0 0 0) }
  to  { clip-path:inset(0 0 0 0) }
}
@keyframes lisiere-monte{
  from{ transform:translateY(var(--course)) }
  to  { transform:translateY(0) }
}
@keyframes lisiere-eteint{
  0%, 40.48%{ opacity:1 }
  100%      { opacity:0 }
}
.epreuve{ animation:bain 1400ms cubic-bezier(.22,1,.36,1) 260ms both }
.lisiere{
  animation:lisiere-monte 1400ms cubic-bezier(.22,1,.36,1) 260ms both,
            lisiere-eteint 1400ms linear 260ms both;
}

/* ═══ MISE EN PAGE INTERMÉDIAIRE — 768 px et plus ═════════════════ */
@media (min-width:768px){
  .scene{
    padding:44px 56px 46px;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:
      "tete tete"
      "dit  tirage"
      "pied pied";
    column-gap:56px;
    align-items:end;
    --course:378px;
  }
  .tete{ grid-area:tete; margin-bottom:0; align-self:start }
  .nav{ gap:24px }
  .dit{ grid-area:dit; align-self:end; padding-bottom:6px }
  .titre{ font-size:44px; line-height:46.6px }
  .tirage{ grid-area:tirage; align-self:end; margin:0 }
  .epreuve{ width:270px; height:378px }
  .lisiere{ left:-48px; width:366px }
  .cartel{ text-align:right }
  .pied{ grid-area:pied; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px 24px; margin-top:0; padding-top:44px }
  .mention{ text-align:right }
}

/* ═══ L'ÉCRAN COTÉ — 1440 × 900 ═══════════════════════════════════
   Grille de référence : 12 colonnes, marges 96 px, gouttières 24 px,
   colonne = 82 px. La colonne 8 commence à x = 838 : c'est la seule
   ligne de force verticale de l'écran, et deux choses s'y accrochent
   — la nav et le bord gauche du tirage.

   Les `top` sont donnés en position de BOÎTE ; la cote du plan est une
   LIGNE DE BASE. L'écart entre les deux a été RELEVÉ dans le navigateur,
   police par police, avec un marqueur inline-block de taille nulle dont
   le bord bas tombe sur la baseline : inter 12/12 → 9,99 px ·
   instrument-serif 44/46,6 → 37,99 px · inter 13/19,5 → 14,00 px ·
   jetbrains-mono 10/16 → 10,99 px. Chaque `top` ci-dessous est la cote
   du plan MOINS cet écart.

   Bilan du vide : ≈ 11,9 % de surface encrée, le noir occupe 88,1 %.
   Le déplacement du tirage n'ajoute rien et n'enlève rien ; la lisière
   n'existe que pendant le geste et pèse 366 × 16 = 5 856 px², soit
   0,45 % — à l'instant photographié le tirage n'est peint qu'aux trois
   quarts, et le vide est donc de 89,6 %. Plancher exigé : 80 %. */
@media (min-width:1440px){
  .scene{
    position:relative; display:block;
    width:1440px; height:900px; min-height:0;
    margin:0 auto; padding:0;
    --course:378px;
  }
  .tete, .dit, .tirage, .pied{
    position:static; display:block; margin:0; padding:0;
  }

  /* Ligne de tête — ligne de base y = 64 */
  .marque{ position:absolute; left:96px; top:54px }
  .nav{ position:absolute; left:838px; top:54px; display:flex; gap:24px; white-space:nowrap }

  /* Le tirage — 270 × 378, bord gauche 838, bord haut 219, bord bas
     597. 42,0 % de la hauteur de l'écran, centre (973, 408) décalé de
     253 px à DROITE et 42 px vers le HAUT du centre géométrique
     (720, 450). Aucun recadrage.

     LE TIRAGE A MONTÉ DE 111 px, ET C'EST LA SECONDE CORRECTION.
     À y 330–708 il tenait dans le tiers bas avec le bloc de titre :
     deux masses côte à côte, aucune tension, et 45 % de noir au-dessus
     que rien ne tenait. À y 219–597 il TRAVERSE la ligne médiane ; la
     tension se joue en diagonale contre le titre en bas à gauche, et
     le vide passe sous le tirage, où il se lit comme sa marge.

     La lisière est 16 px PLUS HAUT que le tirage : son bas porte
     l'arête du bain, elle ne recouvre donc jamais l'image et reste
     tout entière sur le noir. */
  .epreuve{ position:absolute; left:838px; top:219px; width:270px; height:378px }
  .lisiere{ position:absolute; left:790px; top:203px; width:366px }

  /* Titre — 44/46,6, lignes de base 661,4 et 708. Il ne bouge pas :
     le tirage est monté, pas lui — c'est de leur ÉCART que vient la
     tension. Sa première ligne de base porte désormais l'alignement
     caché, avec la troisième ligne du cartel.
     COTE CORRIGÉE DE 0,4 px : le plan demande à la fois un interlignage
     de 46,6 px et deux lignes de base distantes de 47. Les deux ne
     tiennent pas ensemble. On garde l'interlignage écrit (46,6) et on
     cale la DERNIÈRE ligne de base sur 708. La première tombe donc à
     661,4 au lieu de 661. */
  .titre{ position:absolute; left:96px; top:623.4px; font-size:44px; line-height:46.6px; margin:0 }

  /* Sous-titre — ligne de base 740, largeur max 306 */
  .soustitre{ position:absolute; left:96px; top:726px; width:306px; max-width:306px; margin:0 }

  /* Cartel — aligné à droite sur x = 1108, le bord droit du tirage.
     Il suit le tirage : boîte à 618,4, lignes de base 629,4 · 645,4 ·
     661,4, et le même écart de 21,4 px sous le bord bas de l'image
     qu'avant le déplacement.

     L'ALIGNEMENT CACHÉ QUI TRAVERSE LE VIDE A CHANGÉ DE COUPLE. Il
     n'est plus « cartel ligne 1 = sous-titre ligne 1 » à y = 740 — le
     cartel n'est plus là — mais « cartel ligne 3 = titre ligne 1 » à
     y = 661,4 : le bloc de droite finit exactement là où le bloc de
     gauche commence, à 1 012 px de distance.

     Le `margin-right` négatif retranche l'interlettrage traîné par le
     dernier caractère (0,08 em × 10 px). */
  .cartel{ position:absolute; right:332px; margin-right:-.8px; top:618.4px; text-align:right; margin-top:0 }

  /* Bouton — ligne de base 838, filet 10 px dessous */
  .bouton{ position:absolute; left:96px; top:828px }

  /* Bas de page — alignés à droite sur x = 1344, lignes de base 838 et 858 */
  .coord{ position:absolute; right:96px; margin-right:-.8px; top:827px; white-space:nowrap; text-align:right }
  .mention{ position:absolute; right:96px; margin-right:-.8px; top:847px; white-space:nowrap; text-align:right }
}

/* ═══ LES DEUX FILETS DE SÉCURITÉ ═════════════════════════════════
   Un moteur qui ne sait pas animer `clip-path` voit la forme FINALE,
   jamais un cadre vide. Et le mouvement réduit coupe tout sans jamais
   retirer une information : l'état de repos EST l'état final. */
@supports not (clip-path:inset(38% 0 0 0)){
  .epreuve{ animation:none; clip-path:none }
  .lisiere{ animation:none; opacity:0 }
}
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important }
  .epreuve{ clip-path:inset(0 0 0 0) }
  .lisiere{ opacity:0 }
}
</style>
</head>
<body>
<main class="scene">

  <header class="tete">
    <p class="marque">Atelier Lumen</p>
    <nav class="nav" aria-label="Sections">
      <a class="lien courant" href="#" aria-current="page">Œuvres</a>
      <a class="lien" href="#">Séries</a>
      <a class="lien" href="#">L'Atelier</a>
    </nav>
  </header>

  <div class="dit">
    <h1 class="titre"><span class="t1">Une image</span><span class="t2">à la fois.</span></h1>
    <p class="soustitre">Photographie d'architecture, d'intérieur et d'objet. Québec.</p>
    <a class="bouton" href="#">Demander une séance</a>
  </div>

  <figure class="tirage">
    <img class="epreuve"
         src="../../images/secteurs-sites/photo-17.webp"
         width="1000" height="1400"
         fetchpriority="high" decoding="async"
         alt="Une dalle de béton en porte-à-faux sort d'une façade percée de bandeaux de fenêtres. Noir et blanc.">
    <span class="lisiere" aria-hidden="true"></span>
    <figcaption class="cartel">
      <span class="c1">Nº 01 — Dalle en porte-à-faux</span>
      <span class="c2">Béton, bandeaux de fenêtres</span>
      <span class="c3">Noir et blanc, sans retouche</span>
    </figcaption>
  </figure>

  <footer class="pied">
    <p class="coord">000 000-0000 — courriel@exemple.ca — Adresse sur demande</p>
    <p class="mention">Site de démonstration</p>
  </footer>

</main>
