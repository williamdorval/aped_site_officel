<!-- L'INSTANT DE CAPTURE. 690 ms : on est dans le 4e cran (660 → 880 ms),
     celui où l'aplat noir couvre L4, la seule ligne qui touche le bord
     droit. L'outil met toutes les animations en pause et pose leur temps
     local à cette valeur : deux passes rendent la même image. -->
<meta name="aped-instant" content="690">

<link rel="preload" as="font" type="font/woff2" href="../../fonts/demos/anton-1.woff2" crossorigin>

<style>
/* ================================================================
   FONTE NORD — un écran, 1440 × 900, arrêté.
   Aucune photographie, aucun fond, aucun visage : le texte EST l'image.

   ── LES COTES DU PLAN, ET CE QUI A DÛ BOUGER ────────────────────
   Le plan cote la composition au pixel en supposant une hauteur de
   capitale d'Anton de 0,727 em. MESURÉ dans le fichier réellement
   servi (`fonts/demos/anton-1.woff2`, relevé au pixel sur un rendu
   canvas) : la capitale d'Anton fait 0,85938 em, les lettres rondes
   montent à 0,875, et l'accent grave de « À » monte à 1,109.
   Toute l'arithmétique verticale du plan en dépend. Deux règles ont
   guidé la correction :

   1. ON GARDE LES COTES, PAS LES CORPS NOMINAUX. Le plan dit « mur
      180 px » ET « L1 cap-top 0, pied 131 ». Les deux ne peuvent pas
      tenir ensemble avec la vraie police. C'est la COTE qui est la
      composition ; le corps n'en était que la conséquence calculée.
      Corps retenu : 152,25 px → capitale 130,8 px, à 0,2 px de la
      cote du plan (131). Le mur a donc EXACTEMENT la taille dessinée.
      Idem pour le logotype : plan « 76 px, cap-top 730, pied 785 »
      → capitale 55 px → corps 64 px.

   2. L4 SE RÈGLE PAR LA TAILLE, comme le plan l'ordonne. Le plan
      estimait « QUI COMPTE TES REPS » à 8,69 em de chasse et en
      déduisait 166 px pour remplir 1440. La chasse d'encre mesurée
      est de 7,94922 em : il faut donc 181,15 px, hors de la
      fourchette 160–172 qu'il prévoyait. La cote qui compte —
      « la ligne tombe sur 1440 » — est tenue au pixel ; L4 est donc
      plus GROSSE que ses voisines (×1,1898) au lieu d'être plus
      petite. Elle explose en largeur ET en corps : c'est la ligne
      qui force.

   3. L'INTERLIGNAGE. Le plan demande 0,82. Avec une capitale à
      0,85938 em, 0,82 fait se CHEVAUCHER les lignes de 7 px et ne
      laisse plus un pixel pour le filet de la trace. On pose donc
      l'interlignage le plus serré qui reste possible : capitale +
      8 px de blanc, soit 0,912 — les lignes se touchent presque,
      exactement ce que le plan décrit en toutes lettres, et plus
      serré que les 0,88 à 0,96 des autres écrans. Le filet de 2 px
      se loge dans ces 8 px, à 2 px sous le pied et non 7 : il n'y a
      pas 7 px à prendre sans desserrer le mur. Il reste 4 px sous
      le filet et 2 px au-dessus, donc le filet appartient sans
      ambiguïté à la ligne qu'il souligne, pas à celle d'en dessous —
      à 6 px de blanc il tombait au milieu et soulignait les deux.

   4. LE HAUT D'ENCRE DE L1 TOMBAIT À y = −1, PAS À y = 0. Mesuré,
      pas déduit : le mur décalé de +100 px, la barre haute du E de
      « UNE » lue au sous-pixel, la rangée −1 rendait une luminance
      de 11 — du noir PLEIN, couverture 100 %, et la rangée −2 de
      l'acide pur. Une rangée entière de capitale était donc coupée
      par le bord de la fenêtre (deux rangées d'appareil à densité 2).
      Tout le mur — les cinq lignes ET les quatre filets — descend
      de 1 px, soit 0,00657 F. La cote du plan est alors tenue aux
      DEUX bouts : cap-top de L1 à 0, pied de L5 à 711, bandeau à
      712. Et les cinq bandes de l'aplat, qui n'ont pas bougé,
      tombent toutes MIEUX : le débord de capitale au-dessus d'un
      cran passe de 1,5 px à 0,5 px.

   ── LES DEUX JAMBAGES, ET POURQUOI ILS NE SE RÈGLENT PAS AU CORPS ─
   Le jambage du Q d'Anton descend de 0,0925 em sous la ligne de
   base ; l'accent du « À » monte à 1,1 em au-dessus. L'avance de
   ligne est de 138,84 px et la capitale ronde de 132,08 : un
   jambage entre donc de 7,3 px dans la ligne d'en dessous, et
   l'accent de 28,6 px dans celle d'au-dessus. AUCUN corps ne les
   dégage dans les 712 px disponibles — il faudrait un interlignage
   de 0,96, plus lâche que les 0,88 à 0,96 de tous les autres
   écrans, c'est-à-dire perdre la seule chose qui distingue ce mur.
   La correction est donc éditoriale et géométrique, jamais
   typographique.

   · L2 PERD SON Q.  « DES PLAQUES. » posait le jambage du Q à
     x 473 → 516, exactement sur le O de « MONDE » : le mot se
     LISAIT « MÓNDE ». Un chevauchement de jambages est un idiome
     d'affiche ; faire lire un autre mot n'en est pas un. Il n'y a
     pas de décalage qui sauve la ligne — les deux seuls creux de
     L3 mesurent 43 et 45 px pour un jambage de 44, et il faudrait
     viser à 1,6 px près. On retire donc le Q du mot :
     « DE LA FONTE. ». La phrase reste une description de la pièce,
     sans un adjectif, et le mur nomme maintenant la matière dont
     la salle porte le nom — le titre contient le logotype.

   · L5 RENTRE DE 200 px.  Le Q de « QUI » posait son jambage sur
     le A de « À », et le Q AVALAIT l'accent : 689 pixels communs,
     l'accent entièrement noyé dans la panse. « À VOIX HAUTE. » se
     lisait « A VOIX HAUTE. » — encore un autre mot. Les colonnes
     vides de L4 ont été relevées au pixel : [208, 261], [793, 840],
     [1065, 1117]. L'accent mesure 35 px de large et se tient à
     17 px du bord d'encre de L5. Un retrait de 200 px le pose donc
     à x 217 → 251, CENTRÉ dans le creux entre « QUI » et
     « COMPTE » — 9 px à gauche, 10 px à droite — et il n'y a plus
     un seul pixel commun entre les deux lignes. L'accent monte
     dans un blanc, juste au-dessus de sa propre lettre : les deux
     lignes s'emboîtent au lieu de se cogner. Le jambage du Q de L4,
     lui, retombe dans l'acide nu et pend sous son filet : c'est une
     signature, plus un défaut.
     Le retrait est exprimé en F, donc il suit le mur à toutes les
     largeurs et l'accent reste dans son creux.

   ── CE QUE LE RETRAIT RÈGLE EN PASSANT ──────────────────────────
   Le drapeau de droite mesurait 629 · 755 · 734 · 1437 · 771 : la
   moitié droite du mur était un aplat acide vide, 669 px de marge,
   et l'escalier du plan était cassé (L5 plus longue que L3). Il
   mesure maintenant 629 · 703 · 734 · 1437 · 971 — trois courtes
   qui montent, une qui explose au bord, une qui retombe SANS
   revenir au départ. La marge de droite passe de 669 à 469 px,
   sous les 480 que le plan demande.

   Tout le reste du plan est tenu tel quel : fond acide plein cadre,
   mur à y = 0, socle noir collé au bord bas, aucune nav en haut, un
   seul blanc, un seul geste, aucun chiffre. *(Le socle est passé de
   188 à 255 px à la seconde passe, et son arête de 712 à 645, pour
   que L5 le TRAVERSE au lieu d'y être soudée — voir « le socle » plus
   bas.)*

   ── LE GESTE : « LE CRAN » ──────────────────────────────────────
   Un aplat pleine largeur se pose derrière UNE ligne à la fois et
   l'inverse (noir sur acide → acide sur noir). Il descend d'un cran
   toutes les 220 ms, en `step-end` : aucun fondu, aucun glissement.
   Cinq crans, 1 100 ms, puis il disparaît. Quand il quitte une
   ligne, il y laisse un filet noir de 2 px : au-dessus de l'aplat
   des lignes soulignées, en dessous des lignes nues — c'est ce qui
   rend la DIRECTION lisible sur une image arrêtée.

   L'inversion ne duplique pas le texte : l'aplat est un rectangle de
   rgb(225,253,50) en `mix-blend-mode: difference`. |acide − 225,253,50|
   = 11,11,11 (le noir) et |noir − 225,253,50| = 214,242,39 (l'acide) :
   l'échange est exact au bit près, dans les deux sens, et il emporte
   avec lui les jambages et l'accent du « À » qui traversent la
   frontière d'un cran. Une couche de texte dupliquée les aurait
   coupés en deux couleurs incohérentes.

   État de repos = état FINAL : cinq lignes noires sur acide, leurs
   quatre filets, aucun aplat. `prefers-reduced-motion` rend cet
   état directement. Aucune information ne dépend du mouvement.
   ================================================================ */

/* ── LES POLICES ────────────────────────────────────────────────
   Trois familles, trois fichiers. Tous les caractères employés
   (À É È ’ · @) tombent dans U+0000-00FF ou U+2000-206F : aucun
   sous-ensemble latin-ext n'est déclaré, donc aucun n'est chargé.
   Modèle repris de `fonts/demos/_declarations.css`. */
@font-face{font-family:"anton";src:url("../../fonts/demos/anton-1.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:"archivo";src:url("../../fonts/demos/archivo-3.woff2") format("woff2");font-style:normal;font-weight:600;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:"jetbrains-mono";src:url("../../fonts/demos/jetbrains-mono-1.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}

/* ── LES TROIS VALEURS, ET PAS UNE QUATRIÈME ──────────────────── */
:root{
  --acide:#d6f227;   /* fond de page, 100 % de la surface non couverte */
  --noir:#0b0b0b;    /* tout le texte du mur, le bandeau, les filets   */
  --blanc:#ffffff;   /* UNE seule occurrence : le rectangle du bouton  */
  --inv:rgb(225,253,50); /* acide + noir : la couleur qui les échange  */
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{
  /* L'ÉCRAN EST UNE AFFICHE : il se met à l'échelle d'un bloc, il ne
     se recompose pas. 1 rem = 1 px de la maquette à 1440 × 900 —
     donc la composition photographiée est exacte au pixel — et il
     rétrécit proportionnellement si la fenêtre est plus petite ou
     plus courte. Sous 1200 px la réduction rendrait les 10 px du
     bas illisibles : là, et là seulement, la page se réorganise. */
  font-size:min(calc(100vw / 1440), calc(100vh / 900));
}
body{
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:var(--acide);
  color:var(--noir);
  font-family:"archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* Le socle : la masse noire court d'un bord à l'autre de la FENÊTRE,
   pas seulement de la maquette. Sur un écran plus large ou plus haut
   que 1440 × 900, l'affiche se centre sur son fond acide et le noir
   reste franc jusqu'aux bords. À 1440 × 900 il tombe exactement sur
   l'arête du socle : 50vh + 195rem = 645. */
.socle{position:fixed;left:0;right:0;top:calc(50vh + 195rem);bottom:0;background:var(--noir);z-index:0}

/* La scène crée un contexte d'empilement (`z-index` sur un élément
   positionné) : le mélange de la plaque du socle s'y arrête et ne
   descend jamais jusqu'au corps. Elle n'a pas besoin de fond pour
   autant — la plaque ne couvre que 645 → 712, et le MUR y peint
   déjà son acide. *(Une version intermédiaire posait la plaque
   jusqu'à 900 ; il fallait alors un `background` ici, sans quoi la
   plaque rendait son propre acide sur du vide. La plaque a été
   raccourcie, la rustine est partie avec — piège 46.)* */
.scene{position:relative;z-index:1;flex:none;width:1440rem;height:900rem;overflow:hidden}

/* ── LE SOCLE, ET POURQUOI LA DERNIÈRE LIGNE LE TRAVERSE ────────
   Le socle montait à 712, c'est-à-dire au pied de L5 à un pixel
   près. Du noir posé au pied d'une ligne NOIRE ne fait pas une
   arête : il fait une soudure. Les pieds de « À VOIX HAUTE. »
   disparaissaient dans la masse, et à l'échelle du panneau (0,29)
   la ligne se lisait comme un mot mangé par le bas — un débordement
   SUBI, pas un parti. C'est le même défaut que le masque à
   mi-course sur du texte (piège 70) : une lettre tronquée se lit
   comme une faute, jamais comme un mouvement.

   L'arête remonte donc à 645 et la ligne la TRAVERSE. Sous 645 la
   lettre ne s'arrête pas : elle change de couleur et continue, par
   la MÊME plaque `difference` qui sert déjà au cran. Un débordement
   qui se poursuit dans l'autre couleur est lu comme voulu ; un
   débordement qui s'arrête est lu comme une panne.

   POURQUOI 645 ET PAS UNE AUTRE HAUTEUR. Le fût de L5 va de 580 à
   711 : 645 est sa MOITIÉ (65 px au-dessus, 66 en dessous). Cinq
   hauteurs ont été montées et regardées à 1440 puis à 0,29 — 638,
   645, 656, 662, 668. Les traverses des H, A et E de la ligne ont
   été relevées au pixel : elles occupent 598-603, 628-652 et
   670-693. À 656 et à 668 le cut tombe à deux ou trois pixels d'une
   traverse : les deux horizontales se confondent et le mot devient
   mou. À 645 la seule plage d'encre large est la TAILLE DU X
   (x 603-665) — un croisement de deux diagonales, qui n'a aucune
   horizontale à détruire. Les traverses des trois autres lettres
   tombent dessous, dans l'acide, avec de l'air.
   *(Une sonde qui comptait « les rangées sans plage d'encre large »
   déclarait 645 mauvais et 656 bon : elle prenait la taille du X
   pour une traverse et ne mesurait pas la DISTANCE à la traverse
   voisine, qui est la seule chose qui compte. L'œil avait raison
   contre l'instrument — piège 74.)*

   La part inversée fait 66 px à 1440, donc 19 px dans le panneau :
   très au-dessus des 12 px sous lesquels un geste n'existe plus
   (piège 71).

   ── LA PLAQUE NE DESCEND QUE JUSQU'À 712, ET C'EST UNE CORRECTION ─
   Elle couvrait d'abord 645 → 900, et le socle n'avait alors plus
   AUCUN fond déclaré : son noir venait entièrement du mélange.
   `tools/demos-contraste.mjs` a rendu **7 échecs à 1440**, dont
   « 1:1 · 64 px · FONTE NORD ». Le verdict était faux — les pixels
   peints sont bien de l'acide sur du `#0b0b0b`, 16,8:1 — mais
   l'outil ne pouvait pas le savoir : il remonte l'arbre jusqu'à la
   première surface OPAQUE, et une plaque `difference` n'en est pas
   une. Même famille que le piège 45 : un fond peint n'est pas un
   fond déclaré.
   On ne corrige pas l'outil pour un écran ; on lui rend sa prise.
   La plaque s'arrête donc à **712**, exactement là où finit l'encre
   de L5, et le socle reprend son `background` noir sous elle. Les
   pixels sont identiques au bit près — |acide − inv| vaut
   rgb(11,11,11), qui EST `--noir`, donc les deux noirs se joignent
   sans couture — et le contrôle de contraste retrouve un fond
   opaque à mesurer. */
.plinthe{position:absolute;left:0;top:645rem;width:1440rem;height:67rem;background:var(--inv);mix-blend-mode:difference}

/* ================= LE MUR =================
   Cinq lignes, fer à gauche à x = 0, cap-top de L1 à y = 0.
   Toutes les cotes sont des multiples de --F : le même jeu de
   nombres sert à 1440 px et à 320 px. */
.mur{
  --F:152.25rem;
  position:absolute;left:0;top:0;
  width:1440rem;height:4.67652em;      /* 712 rem, jusqu'au bandeau */
  margin:0;font-size:var(--F);
  font-family:"anton",Impact,"Arial Narrow",sans-serif;
  font-weight:400;letter-spacing:0;    /* jamais négatif : Anton est déjà condensée */
  background:var(--acide);
  isolation:isolate;                   /* le mélange de l'aplat reste dans le mur */
  overflow:hidden;
}
.l{position:absolute;left:0;display:block;line-height:1;white-space:nowrap;color:var(--noir)}
/* `margin-left` négatif : on purge l'approche gauche d'Anton pour que
   le FÛT de la première lettre tombe sur x = 0, pas son blanc.
   Valeur mesurée glyphe par glyphe (U 0,01563 em · D et E 0,03125).
   Les cinq `top` portent le décalage de +1 px (0,00657 F) qui remet
   le haut d'encre de L1 sur y = 0 — voir le point 4 en tête. */
.l1{font-size:var(--F);top:calc(-0.05705 * var(--F));margin-left:calc(-0.01563 * var(--F))}
.l2{font-size:var(--F);top:calc( 0.85487 * var(--F));margin-left:calc(-0.03125 * var(--F))}
.l3{font-size:var(--F);top:calc( 1.76680 * var(--F));margin-left:calc(-0.03125 * var(--F))}
.l4{font-size:calc(1.18982 * var(--F));top:calc(2.66664 * var(--F));margin-left:calc(-0.01860 * var(--F))}
/* L5 RENTRE DE 200 px (1,31363 F), moins la purge d'approche du À.
   Le retrait pose l'accent du « À » dans le creux de L4 entre
   « QUI » et « COMPTE », et sort L5 de sous le jambage du Q. */
.l5{font-size:var(--F);top:calc( 3.75377 * var(--F));margin-left:calc(1.31363 * var(--F) - 0.01563 * var(--F))}

/* LA TRACE. Un filet de 2 px, de x = 0 à la largeur d'encre de la
   ligne, posé dans le blanc qui la sépare de la suivante. Il paraît
   d'un coup à l'instant où l'aplat quitte la ligne, et il reste.
   L'état de repos est `opacity:1` : sans animation, les quatre
   filets sont là. */
.t{position:absolute;left:0;height:calc(0.01314 * var(--F));background:var(--noir);opacity:1}
.t1{top:calc(0.87909 * var(--F));width:calc(4.13379 * var(--F));animation:parait 220ms step-end forwards}
.t2{top:calc(1.79101 * var(--F));width:calc(4.61912 * var(--F));animation:parait 440ms step-end forwards}
.t3{top:calc(2.70294 * var(--F));width:calc(4.84131 * var(--F));animation:parait 660ms step-end forwards}
.t4{top:calc(3.77799 * var(--F));width:calc(9.45824 * var(--F));animation:parait 880ms step-end forwards}
@keyframes parait{from{opacity:0}to{opacity:1}}

/* L'APLAT. Un rectangle pleine largeur qui échange les deux couleurs
   là où il tombe. `clip-path` en pourcentage de la hauteur du mur :
   les cinq crans sont les cinq bandes de lignes, et le cinquième
   vient mourir sur le bord haut du bandeau — à la dernière image,
   l'aplat et le bandeau ne font plus qu'une seule masse noire. */
.aplat{
  position:absolute;inset:0;
  background:var(--inv);
  mix-blend-mode:difference;
  clip-path:inset(100% 0 0 0);        /* repos : rien */
  animation:cran 1100ms step-end forwards;
}
@keyframes cran{
  0%   {clip-path:inset(0% 0 80.500% 0)}        /* L1  y   0 → 139 */
  20%  {clip-path:inset(19.500% 0 61.000% 0)}   /* L2  y 139 → 278 */
  40%  {clip-path:inset(39.000% 0 41.500% 0)}   /* L3  y 278 → 417 */
  60%  {clip-path:inset(58.500% 0 18.511% 0)}   /* L4  y 417 → 580  ← l'instant */
  /* Le 5e cran s'arrête sur l'arête du socle, à 645, et non plus à
     712 : au-delà il repasserait sur la plaque du socle et une
     seconde `difference` rendrait l'acide au lieu du noir. Il vient
     donc SE SOUDER au socle — à la dernière image, l'aplat et le
     socle ne font plus qu'une seule masse. */
  80%  {clip-path:inset(81.489% 0 9.410% 0)}    /* L5  y 580 → 645 */
  100% {clip-path:inset(100% 0 0 0)}            /* il n'est plus là */
}

/* ================= LE SOCLE, CÔTÉ CONTENU =================
   x 0 → 1440, y 712 → 900. Le socle VISIBLE commence 67 px plus
   haut, à 645 : cette bande-là est celle que la plaque inverse, et
   rien ne s'y pose — elle appartient à la traversée de L5. Sous
   712, c'est ce bloc-ci, avec un vrai fond noir. Les deux noirs
   sont le même `#0b0b0b` : on ne voit qu'une seule masse.
   Il porte TOUT le mobilier : il n'y a aucune nav en haut de
   l'écran, le bord haut appartient au titre.

   Le rang 1 commence à 730, soit 19 px sous le pied de L5.

   PAS DE FILET DE SÉPARATION. Il y en avait un, acide, de 1 px, sur
   toute la largeur, à 796. C'était la marque la plus « pied de
   page » de l'écran — deux rangs séparés par une réglure, comme
   partout. Le logotype fait 64 px et les coordonnées 12 : le saut
   de taille sépare déjà les deux rangs, et une réglure par-dessus
   n'ajoutait qu'un aveu. Le filet reste dans le vocabulaire —
   il y sert quatre fois, comme trace du geste dans le mur. */
.bandeau{position:absolute;left:0;top:712rem;width:1440rem;height:188rem;background:var(--noir)}

/* Rang 1 — logotype à gauche, nav à droite. */
.logo{
  position:absolute;left:28rem;top:13.928rem;    /* pied 785, donc cap-top 730 */
  font-family:"anton",Impact,"Arial Narrow",sans-serif;font-weight:400;
  font-size:64rem;line-height:1;letter-spacing:0;
  color:var(--acide);white-space:nowrap;
}
.nav{position:absolute;right:28rem;top:38.324rem;display:flex;gap:28rem}  /* ligne de base 762 */
.nav a{
  font-family:"archivo",system-ui,sans-serif;font-weight:600;
  font-size:14rem;line-height:1;letter-spacing:0.14em;
  color:var(--acide);text-decoration:none;white-space:nowrap;
  position:relative;
}
.nav a:last-child{margin-right:-0.14em}   /* la chasse d'après la dernière lettre ne compte pas au fer */
/* Micro-interaction : le même filet que la trace du mur, en acide. */
.nav a::after{content:"";position:absolute;left:0;right:0.14em;bottom:-0.5em;height:2rem;background:var(--acide);transform:scaleX(0);transform-origin:0 50%;transition:transform 160ms linear}
.nav a:hover::after,.nav a:focus-visible::after{transform:scaleX(1)}
.nav a:focus-visible{outline:2rem solid var(--acide);outline-offset:6rem}

/* Rang 2 — identité et coordonnées à gauche ; le bouton dans l'angle.

   DEUX LIGNES, PAS TROIS. Il y en avait trois : identité 13 px
   archivo, coordonnées 12 px mono, mention 10 px mono. Trois rangs,
   trois corps, deux familles, en escalier décroissant — la
   silhouette exacte d'un pied de page légal. À 0,29 ces trois
   lignes tombent à 3,8 · 3,5 · 2,9 px : c'est de la TEXTURE, et une
   texture se compose en blocs réguliers, jamais en trois rangs qui
   miment de l'information qu'on ne peut plus lire. La mention et
   les coordonnées tiennent maintenant sur une SEULE ligne, d'un
   seul corps : le bloc devient une réglure de gris homogène, ce
   qu'il aurait toujours dû être. `ADRESSE SUR DEMANDE` disparaît —
   la ville est déjà nommée à la ligne du dessus, et rien ne se perd.
   La mention de démonstration, elle, reste au même corps que le
   numéro : elle n'est ni cachée ni rapetissée. */
.ident,.tel{position:absolute;left:28rem;margin:0;line-height:1;color:var(--acide);white-space:nowrap}
.ident{top:125.158rem;font-family:"archivo",system-ui,sans-serif;font-weight:600;font-size:13rem;letter-spacing:0.16em}  /* base 846 */
.tel{top:151.680rem;font-family:"jetbrains-mono",ui-monospace,monospace;font-weight:500;font-size:12rem;letter-spacing:0.06em}  /* base 872, soit 28 du bord bas — la marge de gauche */

/* LE BOUTON — seul objet blanc de l'écran, et seul appel à l'action.
   Aucun rayon, aucun filet, aucune ombre, aucune flèche : un
   rectangle et un mot.

   SES QUATRE CÔTÉS ONT MAINTENANT UNE RAISON, ET C'EST LA
   CORRECTION. Il était posé à x 1080 → 1412, y 812 → 878 : le seul
   objet de l'écran dont aucune arête ne se déduisait d'autre chose,
   quatre nombres qui n'étaient que le reste d'une soustraction.
   C'est exactement ce que « zéro élément par défaut » désigne — non
   pas le bouton, qui est mérité, mais son ASSIETTE.
   · bord droit **1412** — la marge de 28, celle de la nav et du
     logotype ;
   · bord haut **785** — le pied du logotype ;
   · bord bas **872** — la ligne de base des coordonnées.
   Il fait donc exactement la hauteur du bloc d'information qu'il
   conclut : **332 × 87**. Il ne flotte plus au milieu d'un noir, il
   est tenu par ses voisins.

   ET IL NE TOUCHE PAS LE CADRE, ce qui a été essayé et REFUSÉ. Une
   première correction l'encastrait dans l'angle bas-droit, pour la
   même raison que L1 touche le bord haut. À 1440 c'était juste ; à
   0,29, dans le panneau, l'écran est posé sur une carte CLAIRE et
   le blanc du bouton s'y fondait — le coin de l'écran paraissait
   ARRACHÉ. Le seul blanc de la page ne peut pas toucher un bord :
   il lui faut du noir sur ses quatre côtés pour rester un objet.
   *(Encore un verdict qui ne se voit qu'à l'échelle de l'aperçu, et
   jamais à pleine taille.)* */
.cta{
  position:absolute;left:1080rem;top:73rem;width:332rem;height:87rem;   /* y 785 → 872 */
  display:flex;align-items:center;justify-content:center;
  background:var(--blanc);color:var(--noir);text-decoration:none;
  font-family:"anton",Impact,"Arial Narrow",sans-serif;font-weight:400;
  font-size:32rem;line-height:1;letter-spacing:0;
  transition:background-color 140ms linear,color 140ms linear;
}
.cta:hover,.cta:focus-visible{background:var(--acide);color:var(--noir)}
.cta:active{background:var(--noir);color:var(--acide)}
.cta:focus-visible{outline:3rem solid var(--noir);outline-offset:-9rem}

/* ── SOUS 1200 px : L'AFFICHE SE RECOMPOSE ──────────────────────
   Réduite au bloc, la ligne de coordonnées tomberait sous 3 px. Le
   mur garde ses proportions exactes — donc le geste et ses cotes en
   pourcentage restent justes — et le socle passe en colonne.

   LA TRAVERSÉE NE SUIT PAS. En colonne, le socle n'est plus posé à
   une hauteur choisie : il suit le flux et sa hauteur dépend du
   repli des libellés. Une plaque d'inversion posée là couperait la
   dernière ligne à un endroit qui n'a été ni mesuré ni regardé, et
   pourrait tomber en plein sur une traverse. On la retire, et le
   socle reprend un fond noir plein : la ligne est alors entière,
   nette, au-dessus d'une masse noire. Aucune information ne se
   perd — la traversée est une composition, pas un contenu. */
@media (max-width:1199px){
  html{font-size:16px}
  body{display:block}
  .socle,.plinthe{display:none}
  .bandeau{background:var(--noir)}
  .scene{width:auto;height:auto;min-height:100vh;display:flex;flex-direction:column;overflow:visible}
  /* L4 = 1,18982 × F et sa chasse d'encre vaut 7,94922 em :
     F = 100vw / (7,94922 × 1,18982) = 10,573vw fait tomber L4
     exactement sur le bord droit, à toute largeur. */
  .mur{--F:10.573vw;position:relative;width:100%;height:4.67652em}
  /* À 360 px le filet proportionnel tomberait à 0,5 px : le navigateur
     le rendrait en gris pâle et la trace ne se verrait plus. Plancher. */
  .t{height:max(1.5px,calc(0.01314 * var(--F)))}
  .bandeau{position:static;width:auto;height:auto;margin-top:auto;
           display:grid;grid-template-columns:100%;
           padding:clamp(14px,4vw,26px) clamp(16px,4vw,28px) clamp(18px,5vw,28px)}
  .logo,.nav,.ident,.tel,.cta{position:static}
  .logo{display:block;font-size:clamp(34px,9.4vw,58px);margin:0 0 .34em}
  .nav{display:flex;flex-wrap:wrap;gap:12px 20px;margin:0}
  .nav a{font-size:12px}
  .nav a:last-child{margin-right:0}
  .nav a::after{height:2px}
  .ident,.tel{white-space:normal}
  .ident{font-size:12px;letter-spacing:0.12em;margin-top:clamp(14px,4vw,22px)}
  .tel{font-size:12px;line-height:1.5;margin:.7em 0 0}
  .cta{width:100%;max-width:332px;height:58px;font-size:26px;margin-top:clamp(16px,4vw,22px)}
  .cta:focus-visible{outline-width:3px;outline-offset:-9px}
  .nav a:focus-visible{outline-width:2px;outline-offset:6px}
}

/* Entre 860 et 1199 px le bandeau reprend ses deux rangs : empilé, il
   faisait 325 px et la page dépassait de 18 px à 1199 × 900. */
@media (min-width:860px) and (max-width:1199px){
  .bandeau{grid-template-columns:1fr auto;
           grid-template-areas:"logo nav" "coords cta";
           column-gap:32px;row-gap:clamp(14px,4vw,22px);align-items:center}
  .logo{grid-area:logo;margin:0}
  .nav{grid-area:nav;justify-self:end;flex-wrap:nowrap}
  .coords{grid-area:coords}
  .coords .ident{margin-top:0}
  .cta{grid-area:cta;justify-self:end;width:332px;margin:0}
}

/* ── LES TROIS GARDE-FOUS ──────────────────────────────────────
   Un moteur qui ignore `clip-path` ou `mix-blend-mode` ne doit
   jamais voir une page vide : il voit l'état FINAL, qui est aussi
   l'état de repos. Idem sous mouvement réduit — les filets ne
   portent aucune information, ils sont une trace.

   LE SOCLE, LUI, N'EST PAS UNE ANIMATION. Sans `mix-blend-mode`,
   le retirer laisserait des libellés acides sur un fond acide : le
   pied de l'écran deviendrait illisible. On le repeint donc en noir
   plein — la ligne cesse simplement de traverser, et rien d'autre
   ne change. Un garde-fou qui casse la page qu'il protège est pire
   que pas de garde-fou. */
@supports not (clip-path:inset(0px 0px 0px 0px)){.aplat{display:none}}
@supports not (mix-blend-mode:difference){
  .aplat{display:none}
  .plinthe{mix-blend-mode:normal;background:var(--noir)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .aplat{display:none}
  .t{opacity:1}
  /* `.plinthe` reste : la traversée est l'état de REPOS, pas un geste. */
}
</style>
</head>
<body>

<div class="socle" aria-hidden="true"></div>

<main class="scene">

  <h1 class="mur">
    <span class="l l1">UNE BARRE.</span>
    <span class="l l2">DE LA FONTE.</span>
    <span class="l l3">ET DU MONDE</span>
    <span class="l l4">QUI COMPTE TES REPS</span>
    <span class="l l5">À VOIX HAUTE.</span>
    <span class="t t1" aria-hidden="true"></span>
    <span class="t t2" aria-hidden="true"></span>
    <span class="t t3" aria-hidden="true"></span>
    <span class="t t4" aria-hidden="true"></span>
    <span class="aplat" aria-hidden="true"></span>
  </h1>

  <!-- LE SOCLE. Peint APRÈS le mur, et avant son contenu : il inverse
       ce qui est déjà là — l'acide devient noir, et les pieds de
       « À VOIX HAUTE. » deviennent acides — puis le logotype, la nav,
       les coordonnées et le bouton se posent par-dessus, intacts. -->
  <div class="plinthe" aria-hidden="true"></div>

  <footer class="bandeau">
    <span class="logo">FONTE NORD</span>

    <nav class="nav" aria-label="Sections">
      <a href="#">LE PLATEAU</a>
      <a href="#">L’HORAIRE</a>
      <a href="#">LES COACHS</a>
      <a href="#">PREMIÈRE VISITE</a>
    </nav>

    <div class="coords">
      <p class="ident">ATELIER DE FORCE · VILLERAY, MONTRÉAL</p>
      <p class="tel">000 000-0000 · COURRIEL@EXEMPLE.CA · SITE DE DÉMONSTRATION</p>
    </div>

    <a class="cta" href="#">RÉSERVER UN ESSAI</a>
  </footer>

</main>

</body>
</html>
