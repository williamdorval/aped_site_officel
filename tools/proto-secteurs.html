  body { padding: 2rem; background: var(--surface-0); }

  .proto-grille { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; }
  .proto-item { display: grid; gap: 0.5rem; }
  .proto-item > figcaption {
    font-family: var(--font-data);
    font-size: 0.6875rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  /* Le cadre reproduit la scene reelle : `.mock-stage` est
     `position: relative` et chaque `.mock` y est en `inset: 0`. */
  .proto-cadre { position: relative; border: 1px solid var(--rule-strong); overflow: hidden; }
  .proto-cadre--640 { width: 640px; height: 423px; }
  .proto-cadre--300 { width: 300px; height: 198px; }
  h2.proto-h { margin: 3rem 0 1rem; font-size: 1.125rem; }
</style>

<script>
(function () {
  var tpl = document.getElementById("tplSecteurs");
  var noms = {
    restaurant: "01 restauration", boutique: "02 boutique", coiffure: "03 coiffure",
    gym: "04 gym", hotel: "05 hébergement", garage: "06 garage",
    construction: "07 construction", paysagement: "08 paysagement", clinique: "09 clinique",
    immobilier: "10 immobilier", juridique: "11 juridique", photo: "12 photographe",
    atelier: "13 votre industrie"
  };

  function peupler(hote, taille) {
    var frag = tpl.content.cloneNode(true);
    Array.prototype.forEach.call(frag.querySelectorAll(".mock"), function (m) {
      m.classList.add("is-on");
      var fig = document.createElement("figure");
      fig.className = "proto-item";
      var cadre = document.createElement("div");
      cadre.className = "proto-cadre proto-cadre--" + taille;
      cadre.appendChild(m);
      var cap = document.createElement("figcaption");
      cap.textContent = noms[m.dataset.mock] || m.dataset.mock;
      fig.appendChild(cadre);
      fig.appendChild(cap);
      fig.dataset.mock = m.dataset.mock;
      fig.dataset.taille = taille;
      hote.appendChild(fig);
    });
  }

  peupler(document.getElementById("grille640"), "640");
  peupler(document.getElementById("grille300"), "300");

  var b = document.getElementById("bascule");
  b.addEventListener("click", function () {
    var s = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = s;
    b.textContent = "Thème : " + (s === "dark" ? "sombre" : "clair");
  });

  /* Les captures doivent etre STABLES : une animation en cours rend
     deux captures du meme etat differentes. Ce bouton fige tout au
     dernier etat de la boucle, qui est aussi l'etat de repos sous
     mouvement reduit. */
  var a = document.getElementById("basculeAnim");
  a.addEventListener("click", function () {
    var fige = document.body.classList.toggle("proto-fige");
    a.textContent = "Animations : " + (fige ? "figées" : "oui");
  });
})();
</script>
